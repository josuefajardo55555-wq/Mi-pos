name: Build Mi POS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'artifacts/mi-pos/android/**'
  workflow_dispatch:   # también se puede ejecutar manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('artifacts/mi-pos/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Dar permisos a gradlew
        run: chmod +x artifacts/mi-pos/android/gradlew

      - name: Compilar APK debug
        working-directory: artifacts/mi-pos/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-pos-debug
          path: artifacts/mi-pos/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
