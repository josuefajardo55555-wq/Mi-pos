name: Build Mi POS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar pnpm
        run: npm install -g pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Instalar dependencias (sin build scripts bloqueados)
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Rebuild esbuild (binario necesario para Vite)
        run: pnpm rebuild esbuild

      - name: Build web + sync Capacitor
        run: pnpm --filter @workspace/mi-pos run build:cap

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('artifacts/mi-pos/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Dar permisos a gradlew
        run: chmod +x artifacts/mi-pos/android/gradlew

      - name: Compilar APK debug
        working-directory: artifacts/mi-pos/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-pos-debug
          path: artifacts/mi-pos/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
